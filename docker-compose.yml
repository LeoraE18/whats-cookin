services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cookin
      POSTGRES_PASSWORD: cookin
      POSTGRES_DB: whats_cookin
    ports:
      - "5432:5432"
    volumes:
      - cookin-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookin -d whats_cookin"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cookin-data:
